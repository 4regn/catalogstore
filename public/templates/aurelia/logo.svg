<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="400" height="110">
  <!-- Tiny terracotta sunburst above the wordmark -->
  <g transform="translate(200, 22)" stroke="#9c7c62" stroke-width="1" stroke-linecap="round">
    <circle cx="0" cy="0" r="3.5" fill="#9c7c62" stroke="none"/>
    <line x1="0" y1="-9" x2="0" y2="-13"/>
    <line x1="0" y1="9" x2="0" y2="13"/>
    <line x1="-9" y1="0" x2="-13" y2="0"/>
    <line x1="9" y1="0" x2="13" y2="0"/>
    <line x1="-6.5" y1="-6.5" x2="-9" y2="-9"/>
    <line x1="6.5" y1="-6.5" x2="9" y2="-9"/>
    <line x1="-6.5" y1="6.5" x2="-9" y2="9"/>
    <line x1="6.5" y1="6.5" x2="9" y2="9"/>
  </g>

  <!-- Wordmark - italic serif sentence case -->
  <text x="200" y="80"
        font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="48" font-weight="400" font-style="italic"
        fill="#2a2a2e" text-anchor="middle" letter-spacing="2.5">Aurelia</text>

  <!-- Subtle tagline -->
  <text x="200" y="103"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="8" font-weight="400"
        fill="#9c7c62" text-anchor="middle"
        letter-spacing="6" text-transform="uppercase">CONSIDERED CARE</text>
</svg>
